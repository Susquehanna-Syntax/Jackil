name: Build & Publish

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
      - "[0-9]*.*.*"
  pull_request:
    branches: [main]

env:
  IMAGE: susquehannasyntax/jackil

jobs:
  # ── Django checks ───────────────────────────────────────────────────────────
  test:
    name: Django Checks
    runs-on: ubuntu-latest

    env:
      # CI runs on SQLite — no Postgres service needed (background jobs are
      # management commands, not Celery/Redis). Values here are CI-only.
      SECRET_KEY: ci-test-secret-key
      DEBUG: "false"
      USE_SQLITE: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the Dockerfile's runtime (python:3.12-slim).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Django system check
        run: python manage.py check
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test --verbosity=2

  # ── Build and push Docker image (main branch + version tags only) ───────────
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
