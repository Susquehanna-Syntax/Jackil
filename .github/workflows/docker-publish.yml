name: Build & Publish

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
      - "[0-9]*.*.*"
  pull_request:
    branches: [main]

env:
  IMAGE: susquehannasyntax/jackil

jobs:
  # ── Django checks ───────────────────────────────────────────────────────────
  test:
    name: Django Checks
    runs-on: ubuntu-latest

    env:
      # CI runs on SQLite — no Postgres service needed (background jobs are
      # management commands, not Celery/Redis). Values here are CI-only.
      SECRET_KEY: ci-test-secret-key
      DEBUG: "false"
      USE_SQLITE: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the Dockerfile's runtime (python:3.12-slim).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Django system check
        run: python manage.py check
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test --verbosity=2

  # ── Build and push Docker image (version tags only) ─────────────────────────
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    # Images are published from version tags only, never from a branch push:
    #   v2026.4.0       -> 2026.4.0 and latest      (production)
    #   v2026.4.0-rc1   -> 2026.4.0-rc1 and rc-latest (release candidate)
    #   v2026.4.0-ex1   -> 2026.4.0-ex1 and ex-latest (experimental)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      # Anything after the version must be a release candidate or experimental
      # build, so a mistyped tag can never reach latest or a channel by accident.
      - name: Check the tag
        run: |
          if ! echo "${GITHUB_REF_NAME}" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-(rc|ex)[0-9]+)?$'; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not vX.Y.Z, vX.Y.Z-rcN or vX.Y.Z-exN"; exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=rc-latest,enable=${{ contains(github.ref_name, '-rc') }}
            type=raw,value=ex-latest,enable=${{ contains(github.ref_name, '-ex') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
