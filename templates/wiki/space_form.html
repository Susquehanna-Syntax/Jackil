{% extends "base.html" %}

{% block title %}{% if space %}Edit {{ space.name }}{% else %}New Space{% endif %} — Jackil{% endblock %}

{% block content %}
<div class="fade-in d1">
  <a href="{% if space %}{% url 'wiki:space_detail' space.slug %}{% else %}{% url 'wiki:home' %}{% endif %}" class="btn btn-ghost" style="margin-bottom: 24px;">
    &larr; Back to the Wiki
  </a>

  <div class="page-title">{% if space %}Edit {{ space.name }}{% else %}New Space{% endif %}</div>

  <form method="post" style="max-width: 640px;">
    {% csrf_token %}
    <div class="form-card">
      <div class="form-group">
        <label class="form-label" for="id_name">Name</label>
        <input type="text" name="name" id="id_name" class="form-input" maxlength="120" value="{{ space.name|default:'' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="id_description">Description</label>
        <input type="text" name="description" id="id_description" class="form-input" maxlength="300" value="{{ space.description|default:'' }}">
      </div>
      <div class="form-group">
        <label class="form-label" for="id_icon_color">Colour</label>
        <select name="icon_color" id="id_icon_color" class="form-select">
          {% for colour in colours %}
          <option value="{{ colour }}" {% if space.icon_color == colour %}selected{% endif %}>{{ colour|capfirst }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <button type="submit" class="btn btn-lav">{{ submit_label }}</button>
  </form>
</div>
{% endblock %}
