{% extends "base.html" %}
{% load static %}

{% block title %}Sign In — Jackil{% endblock %}

{% block auth_content %}
<div class="auth-container">
  <div class="auth-card fade-in">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 56px; height: 56px; background: var(--lavender); border-radius: var(--r-md); display: grid; place-items: center; margin: 0 auto; font-family: 'Fraunces', serif; font-weight: 700; font-size: 24px; color: var(--bg);">J</div>
    </div>
    <div class="auth-title">Sign In</div>
    <div class="auth-sub">Access your IT ticket dashboard</div>

    <form method="post" style="margin-top: 8px;">
      {% csrf_token %}

      {% if form.errors %}
      <div class="message message-error" style="margin-bottom: 16px;">
        Please correct the error below.
      </div>
      {% endif %}

      <div class="form-group">
        <label class="form-label" for="id_username">Username</label>
        <input type="text" name="username" id="id_username" class="form-input" placeholder="Enter your username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="id_password">Password</label>
        <input type="password" name="password" id="id_password" class="form-input" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-filled-lav" style="width: 100%; justify-content: center; display: flex;">Sign In</button>
    </form>

    <div class="auth-link">Don't have an account? <a href="{% url 'accounts:register' %}">Register</a></div>
  </div>
</div>
{% endblock %}
