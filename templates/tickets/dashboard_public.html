{% extends "base.html" %}

{% block auth_content %}
{% load static %}
<div class="auth-container">
  <div class="auth-card fade-in">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 56px; height: 56px; background: var(--lavender); border-radius: var(--r-md); display: grid; place-items: center; margin: 0 auto; font-family: 'Fraunces', serif; font-weight: 700; font-size: 24px; color: var(--bg);">J</div>
    </div>
    <div class="auth-title">Welcome to Jackil</div>
    <div class="auth-sub">IT Ticket Management for Teams</div>
    <p style="text-align: center; font-size: 14px; color: var(--text-2); margin-bottom: 32px; line-height: 1.6;">
      Track, assign, and resolve IT tickets efficiently.<br>Free and open source.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-filled-lav" style="width: 100%; justify-content: center; display: flex;">Sign In</a>
    <div class="auth-link">Don't have an account? <a href="{% url 'accounts:register' %}">Register</a></div>
  </div>
</div>
{% endblock %}
